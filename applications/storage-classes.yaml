apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-classes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prasadGotIT/eks-argocd.git
    targetRevision: main
    path: storage-classes
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true